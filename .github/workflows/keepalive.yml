# Keeps the free Supabase project awake. Free projects pause after 1 week without
# activity; this pings it every 3 days. GitHub also switches off scheduled jobs in
# repos with no activity for 60 days, so when the repo has been quiet for 45+ days
# the job makes a tiny commit to keep itself running.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *' # every 3 days at 06:17 UTC
  workflow_dispatch: # "Run workflow" button for testing

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase (public key only — safe, Row Level Security protects data)
        run: |
          URL=$(jq -r .url src/main/cloud/project.json)
          KEY=$(jq -r .publishableKey src/main/cloud/project.json)
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          echo

      - name: Keep this schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Days since last commit: $days"
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u > .github/keepalive.txt
            git add .github/keepalive.txt
            git commit -m "keepalive: keep the scheduled Supabase ping enabled"
            git push
          fi
